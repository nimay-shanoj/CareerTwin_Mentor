<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CareerTwin{% endblock %}</title>
  <meta name="description" content="{% block description %}CareerTwin{% endblock %}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#0d3b2e">

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("careertwin-theme");
        var prefers = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", stored || (prefers ? "dark" : "light"));
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- The fonts are served by this app, not by Google: a third-party
       stylesheet in <head> is render blocking, and on a LAN it can be the
       difference between a page that appears instantly and one that takes
       thirty seconds. -->
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="preload" href="/static/fonts/DMSans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/Poppins-700.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block page_css %}{% endblock %}

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d3b2e'/%3E%3Cpath d='M10 23v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2' fill='none' stroke='%239cff57' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='3.5' fill='none' stroke='%239cff57' stroke-width='2'/%3E%3C/svg%3E">

  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    {% include "partials/_sidebar.html" %}

    <div class="app-main">
      {% include "partials/_topbar.html" %}

      <main class="page" id="main-content">
        {% include "partials/_flash.html" %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
